spring:
  application:
    name: storyforge-orchestrator
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${PG_PORT:5432}/storyforge
    username: storyforge
    password: ${DB_PASSWORD:storyforge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false
    datatype:
      enum:
        read-unknown-enum-values-as-null: true

server:
  port: 8080
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info

storyforge:
  data-dir: ${STORYFORGE_DATA_DIR:${user.home}/storyforge-data}
  prompts-dir: ../prompts
  config-dir: ../config
  cors-origins:
    - http://localhost:8000
    - http://localhost:9000
  defaults:
    target-seconds: 960
    format: GREAT_STORIES
    language: en
  worker:
    enabled: true
    poll-ms: 3000
  budget:
    max-usd-per-video: 0
  media:
    ffmpeg: ffmpeg
    ffprobe: ffprobe
    timeout-seconds: 3600
  video:
    width: 1920
    height: 1080
    fps: 30
    words-per-minute: 150
  shots:
    min-seconds: 3
    max-seconds: 6
    max-same-type: 3
    interrupt-every-seconds: 60
  providers:
    tts: mock
    image: mock
    alignment: mock
    render: ffmpeg
    publish: mock
  llm:
    cache: true
    only: ""
    max-repairs: 2
    max-rewrites: 1
    default-route: [claude-code]
    routes: {}
    claude-code:
      enabled: true
      command: claude
      work-dir: ${storyforge.data-dir}/claude-work
      timeout-seconds: 900
      subscription: true
      models:
        fast: haiku
        high: sonnet
      efforts:
        fast: low
        high: medium
      stage-tools:
        research: WebSearch,WebFetch
        assets: Read
  qa:
    loudness-target: -14
    loudness-tolerance: 1
    true-peak-max: -1
    duration-tolerance: 0.10
    min-sources: 8
    critic-average: 8
    critic-hook: 9
  media-svc:
    url: http://127.0.0.1:8090
    timeout-seconds: 900
    autostart: true
    python: ${user.home}/.storyforge/media-venv/Scripts/python.exe
    dir: ../media-svc
  narration:
    voice: af_heart
    speed: 1.0
    lang: en-us
    max-wer: 0.15
    retry-speed-factor: 0.92
  cloudflare:
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_API_TOKEN:}
    image-model: "@cf/black-forest-labs/flux-1-schnell"
    steps: 4
    timeout-seconds: 120
    daily-image-limit: 165
  render-svc:
    dir: ${user.home}/.storyforge/render-svc
    source: ../render-svc
    node: node
    timeout-seconds: 10800
    concurrency: 8
    burn-captions: false
  sound:
    enabled: false
    library-dir: ${storyforge.data-dir}/library
    default-music-license:
      type: licensed
      source: YouTube Audio Library
      url: https://studio.youtube.com/
      evidence: Downloaded by the owner from YouTube Studio Audio Library with "Attribution not required"
  dashboard-url: ${STORYFORGE_DASHBOARD_URL:http://localhost:8080}
  dashboard-dir: ../dashboard/public
  real-media:
    enabled: false
    pexels-api-key: ${PEXELS_API_KEY:}
    pixabay-api-key: ${PIXABAY_API_KEY:}
  host:
    video: ../ChannelAssets/DownRightTalkingMouth.mp4
  clips:
    enabled: false
  youtube:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: http://127.0.0.1:8080/api/youtube/oauth/callback
    category-id: "27"
    language: en
    notify-subscribers: true
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  autopilot:
    enabled: ${STORYFORGE_AUTOPILOT:false}
    cron: "0 0 6 * * MON"
  upscaler:
    enabled: true
    executable: ${user.home}/.storyforge/realesrgan/realesrgan-ncnn-vulkan.exe
    model: realesr-animevideov3
    scale: 2
  keep-awake: true
  shorts:
    enabled: false
    count: 3
    max-seconds: 55
  publish:
    day: SATURDAY
    time: "14:00"
    zone: America/New_York
    veto-hours: 24
