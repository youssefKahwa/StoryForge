storyforge:
  real-media:
    enabled: true
  clips:
    enabled: true
  shorts:
    enabled: true
  sound:
    enabled: true
  llm:
    only: claude-code
  narration:
    # the fast-recap narrator, voiced by the human delivery engine (NVIDIA Magpie, free key in .env)
    voice: magpie:Jason
  providers:
    tts: delivery
    image: cloudflare
    alignment: whisper
    render: remotion
    publish: ${STORYFORGE_PUBLISH:mock}
  video:
    width: 1920
    height: 1080
    fps: 30
    words-per-minute: 135
